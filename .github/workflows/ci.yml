name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run knip
        run: bun run knip

      - name: Run type coverage
        run: bun run type-coverage

      - name: Run type check
        run: bun run typecheck

      - name: Run security audit (informational)
        continue-on-error: true
        run: bun audit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

  dependency-check:
    name: Dependency Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency cruiser
        run: bun run depcruise

  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # Catches deps added/removed/upgraded in package.json without regenerating
      # bun.lock — frozen install fails when resolved versions no longer satisfy
      # the declared constraints.
      - name: Verify resolved versions still satisfy package.json
        run: bun install --frozen-lockfile

      # Catches the subtler drift mode that frozen-lockfile misses: declared
      # ranges or overrides widened in package.json but bun.lock's recorded
      # workspace metadata not refreshed (resolved versions still satisfy, so
      # frozen-lockfile passes, but the lockfile's stored constraints go stale).
      # This is what slipped through main between PRs #160 and #162.
      #
      # Scope: root workspace dependencies/devDependencies + root overrides.
      # The web/ workspace is intentionally NOT checked here because main
      # currently carries pre-existing drift from PR #164 (bun update rewrote
      # ranges in web/package.json but bun.lock's workspaces.web section was
      # not refreshed). Once that drift is fixed in a follow-up, extend this
      # check to iterate all workspaces.
      - name: Verify bun.lock metadata matches package.json
        run: |
          bun -e '
            const fs = require("fs");
            const stripTrailingCommas = (s) => s.replace(/,(\s*[}\]])/g, "$1");
            const lock = JSON.parse(stripTrailingCommas(fs.readFileSync("bun.lock", "utf8")));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const norm = (o) => JSON.stringify(o ?? {}, Object.keys(o ?? {}).sort());
            const fields = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
            const rootLock = lock.workspaces[""];
            let ok = true;
            for (const field of fields) {
              if (norm(pkg[field]) !== norm(rootLock[field])) {
                console.error("Root " + field + " differs between package.json and bun.lock:");
                console.error("  package.json: " + norm(pkg[field]));
                console.error("  bun.lock:     " + norm(rootLock[field]));
                ok = false;
              }
            }
            if (norm(pkg.overrides) !== norm(lock.overrides)) {
              console.error("overrides differ between package.json and bun.lock:");
              console.error("  package.json: " + norm(pkg.overrides));
              console.error("  bun.lock:     " + norm(lock.overrides));
              ok = false;
            }
            if (!ok) {
              console.error("::error::bun.lock metadata is out of sync with package.json. Run \"bun install\" locally and commit the updated bun.lock.");
              process.exit(1);
            }
            console.log("bun.lock root metadata matches package.json.");
          '

