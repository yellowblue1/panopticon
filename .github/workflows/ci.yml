name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run knip
        run: bun run knip

      - name: Run type coverage
        run: bun run type-coverage

      - name: Run type check
        run: bun run typecheck

      - name: Run security audit (informational)
        continue-on-error: true
        run: bun audit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test:unit

  dependency-check:
    name: Dependency Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency cruiser
        run: bun run depcruise

  lockfile-drift:
    name: Lockfile drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies (regenerates lockfile if drifted)
        run: bun install

      - name: Fail if lockfile or manifests changed
        run: |
          if ! git diff --exit-code bun.lock package.json web/package.json; then
            echo "::error::bun.lock is out of sync with package.json. Run 'bun install' locally and commit the updated bun.lock."
            exit 1
          fi

